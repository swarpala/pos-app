<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판매 관리 POS</title>
<meta name="theme-color" content="#e9eeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1818" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="판매관리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one phone-width column. Top bar (menu / title / add), then the active screen.
   The sell screen stacks item grid, cart strip and a teal total dock; the other two are single-column bar lists with a bottom sheet for details. */
:root {
  --bg: #e9eeec;
  --surface: #ffffff;
  --surface-2: #f2f6f5;
  --ink: #15302f;
  --ink-2: #566d6c;
  --line: #d2dddb;
  --teal: #1d5558;
  --teal-ink: #f2fbfa;
  --tile-a: #e8f2f0;
  --tile-b: #cde2df;
  --amber: #e8922a;
  --amber-ink: #2a1700;
  --danger: #bf3a2b;
  --on-danger: #ffffff;
  --scrim: rgba(10, 25, 25, 0.45);
  --f-ui: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --f-num: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1818;
    --surface: #162626;
    --surface-2: #1d3131;
    --ink: #e4efed;
    --ink-2: #93aba8;
    --line: #2a4140;
    --teal: #1b5d60;
    --teal-ink: #eafaf8;
    --tile-a: #1f3b3a;
    --tile-b: #2b4e4c;
    --amber: #f0a043;
    --amber-ink: #2a1700;
    --danger: #ff7a6b;
    --on-danger: #2a0a06;
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1818;
  --surface: #162626;
  --surface-2: #1d3131;
  --ink: #e4efed;
  --ink-2: #93aba8;
  --line: #2a4140;
  --teal: #1b5d60;
  --teal-ink: #eafaf8;
  --tile-a: #1f3b3a;
  --tile-b: #2b4e4c;
  --amber: #f0a043;
  --amber-ink: #2a1700;
  --danger: #ff7a6b;
  --on-danger: #2a0a06;
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 15px/1.4 var(--f-ui);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

/* top bar */
.top { flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; text-align: center; letter-spacing: -0.01em; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 10px; }
.icon-btn.sm svg { width: 18px; height: 18px; }

/* screens */
.screens { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* sell: item grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile {
  position: relative; min-width: 0; max-width: 100%;
  aspect-ratio: 1 / 0.86;
  display: flex; flex-direction: column; justify-content: space-between; align-items: stretch;
  padding: 8px; text-align: left;
  border: 1px solid var(--line); border-radius: 10px;
  background: linear-gradient(180deg, var(--tile-a), var(--tile-b));
  background-size: cover; background-position: center;
  color: var(--ink);
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform 0.08s ease;
}
.tile:active { transform: scale(0.97); }
.tile.photo { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); border-color: transparent; }
.tile.in-cart { box-shadow: inset 0 0 0 2px var(--amber); }
.t-name { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.in-cart .t-name { padding-right: 24px; }
.t-price { align-self: flex-end; font: 600 14px var(--f-num); font-variant-numeric: tabular-nums; }
.t-qty { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--amber); color: var(--amber-ink); font: 700 12px/22px var(--f-num); text-align: center; text-shadow: none; }
.hint { margin: 12px 0 4px; font-size: 12px; color: var(--ink-2); text-align: center; }

/* sell: cart strip */
.cart { flex: none; max-height: min(36%, 250px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cart-note { margin: 0; padding: 11px 14px; font-size: 13px; color: var(--ink-2); text-align: center; }
.cart-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 14px; font-size: 13px; color: var(--ink-2); }
.cart-head b { color: var(--ink); font-family: var(--f-num); }
.link { border: 0; background: none; padding: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.cart-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto 76px; align-items: center; gap: 8px; padding: 6px 12px 6px 14px; border-top: 1px solid var(--line); }
.cname { min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cname small { display: block; font: 400 11px var(--f-num); color: var(--ink-2); }
.step { display: flex; align-items: center; gap: 2px; }
.step button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-size: 18px; line-height: 1; padding: 0; }
.step span { min-width: 26px; text-align: center; font: 600 14px var(--f-num); }
.camt { text-align: right; font: 600 14px var(--f-num); font-variant-numeric: tabular-nums; }

/* sell: total dock */
.dock { flex: none; display: flex; align-items: stretch; gap: 12px; padding: 10px 10px 10px 16px; background: var(--teal); color: var(--teal-ink); border-radius: 14px; }
.sum { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.sum small { font-size: 12px; opacity: 0.8; }
.sum strong { font: 700 26px/1.15 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sum em { font: 600 15px var(--f-ui); font-style: normal; margin-left: 2px; }
.done { flex: none; min-height: 56px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--amber); color: var(--amber-ink); font-size: 17px; font-weight: 700; }
.done:disabled { opacity: 0.4; cursor: default; }
.done:not(:disabled):active { transform: scale(0.97); }

/* history and total: bar list */
.list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
.bar { width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.bar:active { background: var(--surface-2); }
.bar .l { min-width: 0; }
.bar .dt { font: 500 15px var(--f-num); }
.bar .dt.ui { font-family: var(--f-ui); font-weight: 600; }
.bar .sub { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .r { flex: none; font: 700 16px var(--f-num); font-variant-numeric: tabular-nums; }
.bar.cancelled { background: var(--surface-2); }
.bar.cancelled .dt, .bar.cancelled .r { text-decoration: line-through; color: var(--ink-2); }
.bar .memo { font-size: 12px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--danger); color: var(--on-danger); font: 600 11px var(--f-ui); vertical-align: 1px; }
.field textarea { width: 100%; padding: 10px 14px; font: 500 16px/1.4 var(--f-ui); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; resize: none; }
.field .btn { align-self: flex-end; min-height: 40px; font-size: 14px; }
.notice { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
.sheet-actions { display: flex; margin-top: 14px; }
.sheet-actions .btn { flex: 1; }
.empty { margin: auto; padding: 32px 16px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty strong { color: var(--ink); font-size: 16px; }
.empty p { margin: 0; font-size: 13px; }
.empty .btn { margin-top: 10px; }
.grid .empty { grid-column: 1 / -1; }

/* buttons and fields */
.btn { min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 13px; color: var(--ink-2); }
.field input { width: 100%; height: 48px; padding: 0 14px; font: 500 16px var(--f-ui); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.photo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.pick { flex: none; width: 96px; height: 96px; border-radius: 12px; border: 1.5px dashed var(--ink-2); background: var(--surface-2) center / cover no-repeat; display: grid; place-items: center; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.pick.has { border-style: solid; border-color: var(--line); }
.pick.has span { display: none; }
.photo-side { min-width: 0; }
.photo-side p { margin: 0 0 2px; font-size: 12px; color: var(--ink-2); }
.photo-side .link { padding-left: 0; }
.err { min-height: 20px; margin: 0 0 6px; font-size: 13px; color: var(--danger); }
.actions { display: flex; gap: 10px; }
.actions .primary { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

/* drawer */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; }
.scrim.on { opacity: 1; visibility: visible; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: min(84vw, 320px);
  display: flex; flex-direction: column; gap: 6px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  background: var(--surface); border-right: 1px solid var(--line);
  overflow-y: auto; transform: translateX(-102%); visibility: hidden;
  transition: transform 0.22s ease, visibility 0.22s;
}
.drawer.on { transform: none; visibility: visible; }
.drawer h2 { margin: 4px 0 10px 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-2); }
.nav { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; }
.nav b { font-size: 16px; font-weight: 600; }
.nav span { font-size: 12px; color: var(--ink-2); }
.nav[aria-current="page"] { background: var(--tile-a); }
.nav[aria-current="page"] b { color: var(--teal); }
:root[data-theme="dark"] .nav[aria-current="page"] b { color: var(--amber); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav[aria-current="page"] b { color: var(--amber); } }
.drawer-foot { margin-top: auto; padding: 14px 4px 0 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.drawer-foot p { margin: 0 0 4px; font-size: 12px; color: var(--ink-2); }
.drawer-foot .btn { min-height: 42px; font-size: 13px; }
.filebtn { display: flex; align-items: center; justify-content: center; cursor: pointer; }

/* bottom sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; visibility: hidden; transition: visibility 0.24s; }
.sheet-wrap.on { visibility: visible; }
.sheet-wrap .back { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.2s; }
.sheet-wrap.on .back { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin-inline: auto; max-width: 520px; max-height: 88%;
  display: flex; flex-direction: column;
  padding-top: 14px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-radius: 18px 18px 0 0;
  transform: translateY(100%); transition: transform 0.24s ease;
}
.sheet-wrap.on .sheet { transform: none; }
.sh { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; }
.sh h2 { margin: 0; font-size: 17px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.sh h2.mono { font-family: var(--f-num); font-size: 16px; }
.sb { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.sub-line { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 86px; gap: 8px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.drow .n { font-weight: 600; overflow-wrap: anywhere; }
.drow .q, .drow .a { text-align: right; font: 500 13px var(--f-num); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.drow .a { font-size: 14px; font-weight: 600; color: var(--ink); }
.drow.sumrow { border-top: 2px solid var(--ink); margin-top: 2px; }
.drow.sumrow .n { font-weight: 700; }
.drow.sumrow .a { font-size: 17px; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: 90vw; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity 0.2s, transform 0.2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 id="title">판매</h1>
    <button class="icon-btn" id="addBtn" type="button" aria-label="품목 추가">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main class="screens">
    <section class="screen" id="s-idle" aria-label="판매">
      <div class="scroll"><div class="grid" id="grid"></div><p class="hint" id="hint">품목을 길게 누르면 수정하거나 삭제할 수 있습니다.</p></div>
      <div class="cart" id="cart"></div>
      <div class="dock">
        <div class="sum"><small>받을 금액</small><strong><span id="sumNum">0</span><em>원</em></strong></div>
        <button class="done" id="doneBtn" type="button" disabled>거래 완료</button>
      </div>
    </section>

    <section class="screen" id="s-history" aria-label="거래 기록" hidden>
      <div class="scroll"><div class="list" id="histList"></div></div>
    </section>

    <section class="screen" id="s-total" aria-label="일별 합계" hidden>
      <div class="scroll"><div class="list" id="totalList"></div></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="화면 이동">
  <h2>메뉴</h2>
  <button class="nav" type="button" data-go="idle"><b>판매</b><span>품목 담기, 거래 완료, 품목 등록</span></button>
  <button class="nav" type="button" data-go="history"><b>거래 기록</b><span>완료한 거래를 시간순으로 확인</span></button>
  <button class="nav" type="button" data-go="total"><b>일별 합계</b><span>날짜별 판매 수량과 금액</span></button>
  <div class="drawer-foot">
    <p>데이터는 이 기기에만 저장됩니다. 앱을 지우면 함께 사라지니 가끔 백업 파일로 내보내 두세요.</p>
    <button class="btn" type="button" id="exportBtn">백업 내보내기</button>
    <label class="btn filebtn" for="importFile">백업 불러오기</label>
    <input class="sr" id="importFile" type="file" accept=".json,application/json">
    <button class="btn danger" type="button" id="resetBtn">예시 데이터로 덮어쓰기</button>
    <button class="btn danger" type="button" id="wipeBtn">모두 지우기</button>
  </div>
</nav>

<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="back" id="shBack"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sh">
      <h2 id="shTitle"></h2>
      <button class="icon-btn sm" id="shClose" type="button" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sb" id="shBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var KEY = 'posapp.v1';
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var TITLES = { idle: '판매', history: '거래 기록', total: '일별 합계' };

  var items = [];
  var records = [];
  var cart = [];
  var screen = 'idle';
  var editingId = null;
  var formImg = null;
  var notes = {};

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function num(n) { return Number(n).toLocaleString('ko-KR'); }
  function won(n) { return num(n) + '원'; }
  function fmtDT(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }
  function dayLabel(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' (' + WD[d.getDay()] + ')';
  }
  function sumLines(lines) {
    return lines.reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- storage ---------- */
  function seed() {
    var base = [
      ['다올김밥', 5000], ['참치김밥', 3300], ['소불고기김밥', 3500], ['매운제육김밥', 4000],
      ['치즈김밥', 3000], ['돈가스김밥', 3300], ['김치김밥', 3500], ['토핑(500)', 500], ['토핑(1000)', 1000]
    ];
    items = base.map(function (b, i) { return { id: 's' + i, name: b[0], price: b[1], img: null }; });
    var now = Date.now();
    var plan = [
      [25, [[0, 2], [7, 1]]], [70, [[1, 1], [2, 1], [4, 1]]], [160, [[3, 2]]],
      [1535, [[0, 1], [1, 2], [8, 1]]], [1650, [[2, 3]]], [1770, [[5, 1], [6, 1]]], [1940, [[0, 3], [7, 2]]],
      [2940, [[1, 2], [4, 2]]], [3060, [[3, 1], [0, 1], [8, 1]]], [3280, [[6, 2], [2, 1]]]
    ];
    records = plan.map(function (p, k) {
      var lines = p[1].map(function (l) {
        return { name: items[l[0]].name, price: items[l[0]].price, qty: l[1] };
      });
      return { id: 'r' + k, ts: now - p[0] * 60000, lines: lines, total: sumLines(lines) };
    });
    notes = {};
    notes[dayKey(now - 1535 * 60000)] = '예시 메모: 가을 동네 장터';
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.items) && Array.isArray(d.records)) {
          items = d.items; records = d.records;
          notes = d.notes && typeof d.notes === 'object' ? d.notes : {};
          return;
        }
      }
    } catch (e) { /* storage unavailable: fall through to sample data */ }
    items = []; records = []; notes = {};
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, records: records, notes: notes })); } catch (e) { /* in-memory only */ }
  }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1900);
  }

  /* ---------- sell: grid ---------- */
  var tiles = {};
  var grid = $('#grid');

  function tileEl(it) {
    var b = el('button', 'tile');
    b.type = 'button';
    b.dataset.id = it.id;
    if (it.img) {
      b.classList.add('photo');
      b.style.backgroundImage = 'linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0) 46%, rgba(0,0,0,0) 54%, rgba(0,0,0,.6)), url("' + it.img + '")';
    }
    b.appendChild(el('span', 't-name', it.name));
    b.appendChild(el('span', 't-price', num(it.price)));
    var q = el('span', 't-qty');
    q.hidden = true;
    b.appendChild(q);
    return b;
  }

  function renderGrid() {
    grid.replaceChildren();
    tiles = {};
    $('#hint').hidden = items.length === 0;
    if (!items.length) {
      var e = el('div', 'empty');
      e.appendChild(el('strong', null, '등록된 품목이 없습니다'));
      e.appendChild(el('p', null, '품목을 등록하면 이곳에 버튼으로 나타납니다.'));
      var b = el('button', 'btn primary', '품목 추가');
      b.type = 'button';
      b.addEventListener('click', function () { openForm(null); });
      e.appendChild(b);
      grid.appendChild(e);
      return;
    }
    items.forEach(function (it) {
      var t = tileEl(it);
      tiles[it.id] = t;
      grid.appendChild(t);
    });
    updateBadges();
  }

  function qtyOf(id) {
    var c = cart.find(function (x) { return x.id === id; });
    return c ? c.qty : 0;
  }
  function updateBadges() {
    Object.keys(tiles).forEach(function (id) {
      var t = tiles[id];
      var q = qtyOf(id);
      var badge = t.querySelector('.t-qty');
      badge.hidden = q === 0;
      badge.textContent = q;
      t.classList.toggle('in-cart', q > 0);
    });
  }

  /* tap adds one; long press edits */
  var lpTimer = null, lpFired = false, lpX = 0, lpY = 0;
  function clearLp() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
  grid.addEventListener('pointerdown', function (e) {
    var t = e.target.closest('.tile');
    if (!t) return;
    lpFired = false;
    lpX = e.clientX; lpY = e.clientY;
    clearLp();
    lpTimer = setTimeout(function () { lpFired = true; lpTimer = null; openForm(t.dataset.id); }, 550);
  });
  grid.addEventListener('pointermove', function (e) {
    if (lpTimer && (Math.abs(e.clientX - lpX) > 8 || Math.abs(e.clientY - lpY) > 8)) clearLp();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { grid.addEventListener(n, clearLp); });
  grid.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  grid.addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (!t) return;
    if (lpFired) { lpFired = false; return; }
    changeQty(t.dataset.id, 1);
  });

  /* ---------- sell: cart ---------- */
  function cartLines() {
    return cart.map(function (c) {
      var it = items.find(function (i) { return i.id === c.id; });
      return it ? { id: it.id, name: it.name, price: it.price, qty: c.qty } : null;
    }).filter(Boolean);
  }
  function changeQty(id, d) {
    var c = cart.find(function (x) { return x.id === id; });
    if (c) {
      c.qty += d;
      if (c.qty <= 0) cart = cart.filter(function (x) { return x !== c; });
    } else if (d > 0) {
      cart.push({ id: id, qty: d });
    }
    renderCart();
  }

  function renderCart() {
    var lines = cartLines();
    var box = $('#cart');
    box.replaceChildren();
    var total = sumLines(lines);
    var count = lines.reduce(function (s, l) { return s + l.qty; }, 0);
    $('#sumNum').textContent = num(total);
    $('#doneBtn').disabled = lines.length === 0;
    updateBadges();

    if (!lines.length) {
      box.appendChild(el('p', 'cart-note', '품목을 누르면 장바구니에 담깁니다.'));
      return;
    }
    var head = el('div', 'cart-head');
    var hl = el('span', null, '장바구니 ');
    hl.appendChild(el('b', null, String(count)));
    hl.appendChild(document.createTextNode('개'));
    var clear = el('button', 'link', '전체 취소');
    clear.type = 'button';
    clear.dataset.act = 'clear';
    head.append(hl, clear);

    var list = el('div', 'cart-list');
    lines.forEach(function (l) {
      var row = el('div', 'crow');
      var nm = el('div', 'cname', l.name);
      nm.appendChild(el('small', null, num(l.price)));
      var step = el('div', 'step');
      var minus = el('button', null, '−');
      minus.type = 'button'; minus.dataset.act = 'dec'; minus.dataset.id = l.id;
      minus.setAttribute('aria-label', l.name + ' 하나 빼기');
      var plus = el('button', null, '+');
      plus.type = 'button'; plus.dataset.act = 'inc'; plus.dataset.id = l.id;
      plus.setAttribute('aria-label', l.name + ' 하나 더하기');
      step.append(minus, el('span', null, String(l.qty)), plus);
      row.append(nm, step, el('div', 'camt', num(l.price * l.qty)));
      list.appendChild(row);
    });
    box.append(head, list);
  }

  $('#cart').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var act = b.dataset.act;
    if (act === 'clear') { cart = []; renderCart(); }
    else if (act === 'inc') changeQty(b.dataset.id, 1);
    else if (act === 'dec') changeQty(b.dataset.id, -1);
  });

  $('#doneBtn').addEventListener('click', function () {
    var lines = cartLines();
    if (!lines.length) return;
    var snap = lines.map(function (l) { return { name: l.name, price: l.price, qty: l.qty }; });
    var rec = { id: uid('r'), ts: Date.now(), lines: snap, total: sumLines(snap) };
    records.push(rec);
    save();
    cart = [];
    renderCart();
    toast('거래 완료 · ' + won(rec.total));
  });

  /* ---------- history ---------- */
  function summaryOf(lines) {
    var qty = lines.reduce(function (s, l) { return s + l.qty; }, 0);
    var first = lines[0] ? lines[0].name : '';
    return first + (lines.length > 1 ? ' 외 ' + (lines.length - 1) + '종' : '') + ' · ' + qty + '개';
  }
  function emptyState(title, text) {
    var e = el('div', 'empty');
    e.appendChild(el('strong', null, title));
    e.appendChild(el('p', null, text));
    return e;
  }
  function renderHistory() {
    var list = $('#histList');
    list.replaceChildren();
    if (!records.length) {
      list.appendChild(emptyState('거래 기록이 없습니다', '판매 화면에서 거래를 완료하면 여기에 쌓입니다.'));
      return;
    }
    records.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (r) {
      var b = el('button', 'bar');
      b.type = 'button';
      var l = el('div', 'l');
      var dt = el('div', 'dt', fmtDT(r.ts));
      if (r.cancelledAt) {
        b.classList.add('cancelled');
        dt.appendChild(el('span', 'tag', '취소됨'));
      }
      l.appendChild(dt);
      l.appendChild(el('div', 'sub', summaryOf(r.lines)));
      b.append(l, el('div', 'r', won(r.total)));
      b.addEventListener('click', function () { openRecord(r); });
      list.appendChild(b);
    });
  }
  function openRecord(r) {
    var wrap = el('div');
    if (r.cancelledAt) {
      wrap.appendChild(el('p', 'notice', '취소된 거래입니다. 일별 합계에 포함되지 않습니다. (취소 ' + fmtDT(r.cancelledAt) + ')'));
    }
    r.lines.forEach(function (l) {
      var row = el('div', 'drow');
      row.append(el('div', 'n', l.name), el('div', 'q', num(l.price) + ' × ' + l.qty), el('div', 'a', num(l.price * l.qty)));
      wrap.appendChild(row);
    });
    var s = el('div', 'drow sumrow');
    s.append(el('div', 'n', '합계'), el('div', 'q', ''), el('div', 'a', won(r.total)));
    wrap.appendChild(s);

    var act = el('div', 'sheet-actions');
    var btn = el('button', 'btn');
    btn.type = 'button';
    if (r.cancelledAt) {
      btn.textContent = '취소 되돌리기';
      btn.classList.add('primary');
      btn.addEventListener('click', function () {
        delete r.cancelledAt;
        save();
        renderHistory();
        closeSheet();
        toast('거래를 되살렸습니다');
      });
    } else {
      btn.textContent = '거래 취소';
      btn.classList.add('danger');
      var armTimer;
      btn.addEventListener('click', function () {
        if (!btn.classList.contains('armed')) {
          btn.classList.add('armed');
          btn.textContent = '한 번 더 누르면 취소';
          clearTimeout(armTimer);
          armTimer = setTimeout(function () {
            btn.classList.remove('armed');
            btn.textContent = '거래 취소';
          }, 3000);
          return;
        }
        clearTimeout(armTimer);
        r.cancelledAt = Date.now();
        save();
        renderHistory();
        closeSheet();
        toast('거래를 취소했습니다');
      });
    }
    act.appendChild(btn);
    wrap.appendChild(act);
    openSheet(fmtDT(r.ts), wrap, true);
  }

  /* ---------- total ---------- */
  function groupByDay() {
    var map = {};
    records.forEach(function (r) {
      if (r.cancelledAt) return;
      var k = dayKey(r.ts);
      var g = map[k] || (map[k] = { key: k, ts: r.ts, count: 0, total: 0, qty: 0, lines: {} });
      g.count += 1;
      g.total += r.total;
      r.lines.forEach(function (l) {
        var x = g.lines[l.name] || (g.lines[l.name] = { name: l.name, qty: 0, amt: 0 });
        x.qty += l.qty;
        x.amt += l.price * l.qty;
        g.qty += l.qty;
      });
    });
    return Object.keys(map).sort().reverse().map(function (k) { return map[k]; });
  }
  function renderTotal() {
    var list = $('#totalList');
    list.replaceChildren();
    var days = groupByDay();
    if (!days.length) {
      list.appendChild(emptyState('집계할 거래가 없습니다', '거래가 기록된 날짜가 이곳에 나타납니다.'));
      return;
    }
    days.forEach(function (g) {
      var b = el('button', 'bar');
      b.type = 'button';
      var l = el('div', 'l');
      l.appendChild(el('div', 'dt ui', dayLabel(g.ts)));
      l.appendChild(el('div', 'sub', '거래 ' + g.count + '건 · 총 ' + g.qty + '개'));
      if (notes[g.key]) l.appendChild(el('div', 'memo', notes[g.key]));
      b.append(l, el('div', 'r', won(g.total)));
      b.addEventListener('click', function () { openDay(g); });
      list.appendChild(b);
    });
  }
  function openDay(g) {
    var wrap = el('div');
    wrap.appendChild(el('p', 'sub-line', '거래 ' + g.count + '건 · 총 ' + g.qty + '개 판매'));

    var memo = el('div', 'field');
    var ml = el('label', null, '메모 (행사, 장소 등)');
    ml.htmlFor = 'dMemo';
    var ta = document.createElement('textarea');
    ta.id = 'dMemo';
    ta.rows = 2;
    ta.maxLength = 120;
    ta.placeholder = '예: 가을 동네 장터';
    ta.value = notes[g.key] || '';
    var sv = el('button', 'btn', '메모 저장');
    sv.type = 'button';
    sv.addEventListener('click', function () {
      var v = ta.value.trim();
      if (v) notes[g.key] = v; else delete notes[g.key];
      save();
      renderTotal();
      toast(v ? '메모를 저장했습니다' : '메모를 지웠습니다');
    });
    memo.append(ml, ta, sv);
    wrap.appendChild(memo);
    Object.keys(g.lines).map(function (k) { return g.lines[k]; })
      .sort(function (a, b) { return b.amt - a.amt; })
      .forEach(function (x) {
        var row = el('div', 'drow');
        row.append(el('div', 'n', x.name), el('div', 'q', x.qty + '개'), el('div', 'a', num(x.amt)));
        wrap.appendChild(row);
      });
    var s = el('div', 'drow sumrow');
    s.append(el('div', 'n', '전체 판매액'), el('div', 'q', g.qty + '개'), el('div', 'a', won(g.total)));
    wrap.appendChild(s);
    openSheet(dayLabel(g.ts), wrap, false);
  }

  /* ---------- sheet ---------- */
  var sheetWrap = $('#sheetWrap');
  function openSheet(title, node, mono) {
    var h = $('#shTitle');
    h.textContent = title;
    h.classList.toggle('mono', !!mono);
    $('#shBody').replaceChildren(node);
    $('#shBody').scrollTop = 0;
    sheetWrap.classList.add('on');
    sheetWrap.setAttribute('aria-hidden', 'false');
  }
  function closeSheet() {
    sheetWrap.classList.remove('on');
    sheetWrap.setAttribute('aria-hidden', 'true');
  }
  $('#shClose').addEventListener('click', closeSheet);
  $('#shBack').addEventListener('click', closeSheet);

  /* ---------- item form ---------- */
  function resizeImg(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var im = new Image();
        im.onerror = reject;
        im.onload = function () {
          var S = 360;
          var s = Math.min(im.naturalWidth, im.naturalHeight);
          var sx = (im.naturalWidth - s) / 2;
          var sy = (im.naturalHeight - s) / 2;
          var c = document.createElement('canvas');
          c.width = S; c.height = S;
          c.getContext('2d').drawImage(im, sx, sy, s, s, 0, 0, S, S);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function openForm(id) {
    editingId = id || null;
    var it = id ? items.find(function (i) { return i.id === id; }) : null;
    if (id && !it) return;
    formImg = it ? it.img : null;

    var f = document.createElement('form');
    f.noValidate = true;
    f.innerHTML =
      '<div class="photo-row">' +
        '<label class="pick" id="fPick" for="fImg"><span>사진<br>선택</span></label>' +
        '<input class="sr" id="fImg" type="file" accept="image/*">' +
        '<div class="photo-side"><p>품목 버튼의 배경 이미지가 됩니다. 정사각형으로 잘라 저장합니다.</p>' +
        '<button type="button" class="link" id="fImgClear">사진 지우기</button></div>' +
      '</div>' +
      '<div class="field"><label for="fName">품목 이름</label>' +
        '<input id="fName" maxlength="20" autocomplete="off" placeholder="예: 참치김밥"></div>' +
      '<div class="field"><label for="fPrice">가격 (원)</label>' +
        '<input id="fPrice" inputmode="numeric" autocomplete="off" placeholder="예: 3300"></div>' +
      '<p class="err" id="fErr" role="alert"></p>' +
      '<div class="actions"><button type="button" class="btn danger" id="fDel">삭제</button>' +
        '<button type="submit" class="btn primary">저장</button></div>';

    var pick = f.querySelector('#fPick');
    var fImg = f.querySelector('#fImg');
    var fName = f.querySelector('#fName');
    var fPrice = f.querySelector('#fPrice');
    var fErr = f.querySelector('#fErr');
    var fDel = f.querySelector('#fDel');
    var fClear = f.querySelector('#fImgClear');

    fName.value = it ? it.name : '';
    fPrice.value = it ? String(it.price) : '';
    fDel.hidden = !it;

    function paint() {
      pick.style.backgroundImage = formImg ? 'url("' + formImg + '")' : '';
      pick.classList.toggle('has', !!formImg);
      fClear.hidden = !formImg;
    }
    paint();

    fImg.addEventListener('change', function () {
      var file = fImg.files && fImg.files[0];
      if (!file) return;
      resizeImg(file).then(function (data) {
        formImg = data; fErr.textContent = ''; paint();
      }).catch(function () {
        fErr.textContent = '사진을 불러오지 못했습니다. 다른 사진을 선택해 주세요.';
      });
      fImg.value = '';
    });
    fClear.addEventListener('click', function () { formImg = null; paint(); });

    var armTimer;
    fDel.addEventListener('click', function () {
      if (!fDel.classList.contains('armed')) {
        fDel.classList.add('armed');
        fDel.textContent = '한 번 더 누르면 삭제';
        clearTimeout(armTimer);
        armTimer = setTimeout(function () {
          fDel.classList.remove('armed');
          fDel.textContent = '삭제';
        }, 3000);
        return;
      }
      items = items.filter(function (i) { return i.id !== editingId; });
      cart = cart.filter(function (c) { return c.id !== editingId; });
      save();
      renderGrid();
      renderCart();
      closeSheet();
      toast('품목을 삭제했습니다');
    });

    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = fName.value.trim();
      var digits = fPrice.value.replace(/[^\d]/g, '');
      if (!name) { fErr.textContent = '품목 이름을 입력해 주세요.'; fName.focus(); return; }
      if (digits === '') { fErr.textContent = '가격을 숫자로 입력해 주세요.'; fPrice.focus(); return; }
      var price = parseInt(digits, 10);
      if (price > 99999999) { fErr.textContent = '가격이 너무 큽니다.'; fPrice.focus(); return; }
      var editing = !!editingId;
      if (editing) {
        var target = items.find(function (i) { return i.id === editingId; });
        target.name = name; target.price = price; target.img = formImg;
      } else {
        items.push({ id: uid('i'), name: name, price: price, img: formImg });
      }
      save();
      renderGrid();
      renderCart();
      closeSheet();
      toast(editing ? '품목을 수정했습니다' : '품목을 등록했습니다');
    });

    openSheet(it ? '품목 수정' : '품목 추가', f, false);
  }
  $('#addBtn').addEventListener('click', function () { openForm(null); });

  /* ---------- navigation ---------- */
  var drawer = $('#drawer');
  var scrim = $('#scrim');
  var menuBtn = $('#menuBtn');
  function openDrawer() {
    drawer.classList.add('on'); scrim.classList.add('on');
    menuBtn.setAttribute('aria-expanded', 'true');
  }
  function closeDrawer() {
    drawer.classList.remove('on'); scrim.classList.remove('on');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', function () {
    if (drawer.classList.contains('on')) closeDrawer(); else openDrawer();
  });
  scrim.addEventListener('click', closeDrawer);

  function setScreen(name) {
    screen = name;
    $('#title').textContent = TITLES[name];
    ['idle', 'history', 'total'].forEach(function (n) { $('#s-' + n).hidden = n !== name; });
    $('#addBtn').style.visibility = name === 'idle' ? 'visible' : 'hidden';
    document.querySelectorAll('.nav').forEach(function (b) {
      if (b.dataset.go === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (name === 'history') renderHistory();
    if (name === 'total') renderTotal();
    closeDrawer();
  }
  document.querySelectorAll('.nav').forEach(function (b) {
    b.addEventListener('click', function () { setScreen(b.dataset.go); });
  });

  /* two-step confirm for the test-data buttons */
  function armButton(btn, label, armedLabel, action) {
    var timer;
    btn.addEventListener('click', function () {
      if (!btn.classList.contains('armed')) {
        btn.classList.add('armed');
        btn.textContent = armedLabel;
        clearTimeout(timer);
        timer = setTimeout(function () { btn.classList.remove('armed'); btn.textContent = label; }, 3000);
        return;
      }
      clearTimeout(timer);
      btn.classList.remove('armed');
      btn.textContent = label;
      action();
    });
  }
  function refreshAll() {
    cart = [];
    save();
    renderGrid();
    renderCart();
    if (screen === 'history') renderHistory();
    if (screen === 'total') renderTotal();
  }
  armButton($('#resetBtn'), '예시 데이터로 덮어쓰기', '한 번 더 누르면 덮어씁니다', function () {
    seed(); refreshAll(); closeDrawer(); toast('예시 데이터로 덮어썼습니다');
  });
  armButton($('#wipeBtn'), '모두 지우기', '한 번 더 누르면 모두 지웁니다', function () {
    items = []; records = []; notes = {}; refreshAll(); closeDrawer(); toast('품목과 거래 기록을 모두 지웠습니다');
  });

  /* ---------- backup ---------- */
  function exportBackup() {
    var d = new Date();
    var name = 'pos-backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
      pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    var data = JSON.stringify({ app: 'pos', version: 1, exportedAt: Date.now(), items: items, records: records, notes: notes });
    var file = null;
    try { file = new File([data], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function () { /* share sheet dismissed */ });
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  $('#exportBtn').addEventListener('click', function () { closeDrawer(); exportBackup(); });

  function openImport(d) {
    var okItems = d.items.filter(function (i) { return i && typeof i.id === 'string' && typeof i.name === 'string' && typeof i.price === 'number'; });
    var okRecs = d.records.filter(function (r) { return r && typeof r.ts === 'number' && Array.isArray(r.lines) && typeof r.total === 'number'; });
    var wrap = el('div');
    wrap.appendChild(el('p', 'notice', '품목 ' + okItems.length + '개, 거래 ' + okRecs.length + '건이 들어 있는 백업입니다. 불러오면 지금 이 기기의 데이터가 모두 이 백업으로 바뀝니다.'));
    var act = el('div', 'sheet-actions');
    var btn = el('button', 'btn danger', '이 백업으로 덮어쓰기');
    btn.type = 'button';
    var timer;
    btn.addEventListener('click', function () {
      if (!btn.classList.contains('armed')) {
        btn.classList.add('armed');
        btn.textContent = '한 번 더 누르면 덮어씁니다';
        clearTimeout(timer);
        timer = setTimeout(function () { btn.classList.remove('armed'); btn.textContent = '이 백업으로 덮어쓰기'; }, 3000);
        return;
      }
      clearTimeout(timer);
      items = okItems;
      records = okRecs;
      notes = d.notes && typeof d.notes === 'object' ? d.notes : {};
      refreshAll();
      closeSheet();
      toast('백업을 불러왔습니다');
    });
    act.appendChild(btn);
    wrap.appendChild(act);
    openSheet('백업 불러오기', wrap, false);
  }
  $('#importFile').addEventListener('change', function () {
    var inp = this;
    var f = inp.files && inp.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onerror = function () { inp.value = ''; toast('파일을 읽지 못했습니다'); };
    fr.onload = function () {
      var d = null;
      try { d = JSON.parse(fr.result); } catch (e) { d = null; }
      inp.value = '';
      if (!d || !Array.isArray(d.items) || !Array.isArray(d.records)) { toast('백업 파일 형식이 맞지 않습니다'); return; }
      closeDrawer();
      openImport(d);
    };
    fr.readAsText(f);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (sheetWrap.classList.contains('on')) closeSheet();
    else if (drawer.classList.contains('on')) closeDrawer();
  });

  /* ---------- start ---------- */
  load();
  renderGrid();
  renderCart();
  setScreen('idle');

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline cache is optional */ });
    });
  }
})();
</script>

</body>
</html>
